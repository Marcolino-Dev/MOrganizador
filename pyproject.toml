[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-arquivos"
version = "1.0.0"
description = "Organizador Automático de Arquivos - CLI e GUI para categorizar arquivos por extensão"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "lairm", email = "lairm@example.com"}
]
maintainers = [
    {name = "lairm", email = "lairm@example.com"}
]
keywords = ["file-organizer", "cli", "gui", "tkinter", "productivity", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "pyinstaller>=6.0.0",
]
gui = []  # tkinter is stdlib

[project.urls]
Homepage = "https://github.com/lairm/organizador"
Repository = "https://github.com/lairm/organizador"
Issues = "https://github.com/lairm/organizador/issues"
Changelog = "https://github.com/lairm/organizador/blob/main/CHANGELOG.md"

[project.scripts]
organizer = "organizer:main"
organizer-gui = "organizer_gui:main_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["organizador*"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.py$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true

[tool.flake8]
max-line-length = 100
extend-ignore = "E501,W503"
per-file-ignores = """
__init__.py: F401
"""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "setup.py",
    "organizer_gui.py",  # GUI hard to test
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyinstaller]
spec_files = [
    "organizer.spec",
    "organizer_gui.spec",
]