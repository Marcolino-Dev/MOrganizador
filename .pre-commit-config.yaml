# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ==========================================
  # GENERAL HOOKS
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-toml
        name: Validate TOML syntax
      - id: check-json
        name: Validate JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-added-large-files
        name: Prevent large files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        name: Normalize line endings (LF)
        args: ['--fix=lf']

  # ==========================================
  # PYTHON FORMATTING & LINTING
  # ==========================================
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: Format with Black
        args: ['--line-length=100']
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ['--profile=black', '--line-length=100']

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: Lint with flake8
        args: ['--max-line-length=100', '--ignore=E501,W503']
        additional_dependencies: [flake8-bugbear, flake8-comprehensions]

  # ==========================================
  # TYPE CHECKING
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ['--ignore-missing-imports', '--strict-optional']
        additional_dependencies: [types-requests]
        exclude: '^tests/'

  # ==========================================
  # SECURITY
  # ==========================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: Security scan with Bandit
        args: ['-r', 'organizador/', '-r', 'organizer.py', '-r', 'organizer_gui.py', '-ll']
        exclude: '^tests/'

  # ==========================================
  # DEPENDENCY CHECKS
  # ==========================================
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        name: Check dependencies for vulnerabilities
        args: ['--json', '--output', 'safety-precommit.json']

  # ==========================================
  # COMMIT MESSAGE VALIDATION
  # ==========================================
  - repo: https://github.com/committools/pre-commit-commitlint
    rev: v1.0.0
    hooks:
      - id: commitlint
        name: Validate commit message (Conventional Commits)
        args: ['--config', '.commitlintrc.json']
        stages: [commit-msg]

  # ==========================================
  # SPELL CHECK (optional)
  # ==========================================
  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.3.0
  #   hooks:
  #     - id: codespell
  #       name: Check spelling
  #       args: ['--skip=*.pyc,*.png,*.jpg,*.svg,*.ico,dist,build,.git', '--ignore-words=.codespellignore']

# ==========================================
# CONFIGURATION
# ==========================================
default_stages: [pre-commit]
fail_fast: false

# Files to exclude from all hooks
exclude: |
  (?x)^(
    dist/|
    build/|
    \.venv/|
    venv/|
    \.git/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.ruff_cache/|
    htmlcov/|
    \.coverage
  )